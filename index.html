<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111318">
  <title>DiamondBook — Библиотека</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/refinement.css">
  <link rel="stylesheet" href="css/cover-layout.css">
  <link rel="stylesheet" href="css/page-materials.css">
  <link rel="stylesheet" href="css/shelf-rework.css">
  <link rel="stylesheet" href="css/wood-realism.css">
</head>
<body class="library-screen">
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="index.html">Diamond<span>Book</span></a>
      <nav class="top-actions">
        <button class="ghost-button" id="importButton">Импорт</button>
        <button class="primary-button" id="newBookButton">+ Создать книгу</button>
        <input id="fileInput" type="file" accept=".json,.txt,.md,.markdown,.html,.htm,.xhtml,.mhtml,.adoc,.asciidoc,.org,.rst,.djot,.bbcode,.textile,.wiki,.fountain,.rtf,.fb2,.epub,.pdf,.docx,.odt,.xml,.jsonld,.yaml,.yml,.csv,.tsv,.opml,.srt,.vtt" hidden>
      </nav>
    </header>
    <main class="library-page">

      <section class="library-section">
        <div class="library-heading">
          <div class="library-heading-copy">
            <p class="eyebrow">ЛИЧНАЯ БИБЛИОТЕКА</p>
            <h1>Мои книги<span class="library-heading-ornament" aria-hidden="true">✦</span></h1>
            <p class="library-subtitle">Твои истории — на дубовых полках. Всё сохраняется в этом браузере.</p>
          </div>
          <div class="library-heading-stat"><span id="bookCount">0 книг</span><small>в библиотеке</small></div>
        </div>
        <div class="library-tools">
          <label class="library-search">
            <span aria-hidden="true">⌕</span><input id="librarySearch" type="search" placeholder="Название книги или автор…" aria-label="Поиск книг" autocomplete="off">
            <kbd>/</kbd>
          </label>
          <div class="library-sort-custom">
            <span>Порядок</span>
            <select id="librarySort" class="library-sort-original" aria-label="Сортировка книг" tabindex="-1">
              <option value="recent">Недавно изменённые</option><option value="title">По названию</option><option value="oldest">Сначала старые</option>
            </select>
            <div class="library-sort-menu-wrap">
              <button type="button" id="librarySortTrigger" aria-haspopup="listbox" aria-expanded="false">
                <span id="librarySortLabel">Недавно изменённые</span><span aria-hidden="true">⌄</span>
              </button>
              <div class="library-sort-options" id="librarySortOptions" role="listbox" aria-label="Сортировка книг" hidden>
                <button type="button" role="option" aria-selected="true" data-sort="recent">◷ Недавно изменённые</button>
                <button type="button" role="option" aria-selected="false" data-sort="title">↕ По названию</button>
                <button type="button" role="option" aria-selected="false" data-sort="oldest">⌛ Сначала старые</button>
              </div>
            </div>
          </div>
        </div>
        <div class="books-grid" id="booksGrid"></div>
        <p class="library-no-results" id="libraryNoResults" hidden>Ничего не найдено. Попробуй другое название.</p>
        <div class="empty-state" id="emptyState"><div class="empty-icon">✦</div><h3>Здесь пока тихо</h3><p>Создай первую книгу и начни писать свою историю.</p><button class="primary-button" id="emptyCreateButton">Создать первую книгу</button></div>
      </section>
    </main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/formats.js"></script>
  <script src="js/cover-layout.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cover-editor.js"></script>
  <script src="js/import.js"></script>
</body>
</html>
