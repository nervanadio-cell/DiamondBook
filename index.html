<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111318">
  <title>Book Creator — Мои книги</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="index.html">Book<span>Creator</span></a>
      <nav class="top-actions">
        <button class="ghost-button" id="importButton">Импорт</button>
        <button class="primary-button" id="newBookButton">+ Создать книгу</button>
        <input id="fileInput" type="file" accept=".json,.txt,.md,.markdown,.html,.htm,.xhtml,.mhtml,.adoc,.asciidoc,.org,.rst,.djot,.bbcode,.textile,.wiki,.fountain,.rtf,.fb2,.epub,.pdf,.docx,.odt,.xml,.jsonld,.yaml,.yml,.csv,.tsv,.opml,.srt,.vtt" hidden>
      </nav>
    </header>
    <main class="library-page">
      <section class="hero">
        <div>
          <p class="eyebrow">Твоя маленькая библиотека</p>
          <h1>Создавай книги.<br><em>Пиши свои истории.</em></h1>
          <p class="hero-text">Создавай тома, части и главы, пиши в удобном редакторе и читай в спокойном книжном режиме.</p>
        </div>
        <button class="hero-create" id="heroCreateButton"><span>＋</span>Новая книга</button>
      </section>
      <section class="library-section">
        <div class="section-heading"><div><h2>Мои книги</h2><p id="bookCount">0 книг</p></div></div>
        <div class="books-grid" id="booksGrid"></div>
        <div class="empty-state" id="emptyState"><div class="empty-icon">✦</div><h3>Здесь пока тихо</h3><p>Создай первую книгу и начни писать свою историю.</p><button class="primary-button" id="emptyCreateButton">Создать первую книгу</button></div>
      </section>
    </main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/formats.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cover-editor.js"></script>
  <script src="js/import.js"></script>
</body>
</html>
