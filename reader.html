<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#34251a">
  <title>Чтение — DiamondBook</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/reader.css">
</head>
<body class="reader-page">
  <header class="reader-topbar" id="readerTopbar">
    <a class="brand reader-close-link" href="index.html" title="Закрыть книгу"><span class="reader-brand-mark">‹</span> Библиотека</a>
    <div class="reader-book-info"><span id="readerBookTitle">Книга</span><small id="readerChapterTitle">Глава</small></div>
    <a class="ghost-button link-button reader-close-link" id="backToEditor" href="#">Редактор</a>
  </header>

  <aside class="reader-sidebar" id="readerSidebar">
    <div class="reader-sidebar-head"><div><p class="eyebrow">Содержание</p><h2 id="readerContentsTitle">Книга</h2></div><button class="icon-button small" id="closeSidebar" aria-label="Закрыть содержание">×</button></div>
    <div id="readerTree" class="tree"></div>
  </aside>

  <main class="reader-main">
    <div class="reader-stage" id="readerStage">
      <div class="reader-spread" id="readerSpread">
        <article class="reader-sheet reader-sheet-left" id="readerSheetLeft">
          <div class="reader-sheet-head" id="readerLeftHead"><p class="reader-kicker" id="readerKicker"></p><h1 id="readerTitle">Глава</h1><span id="readerRunningLeft" class="reader-running-title" hidden></span></div>
          <div class="reader-page-content" id="readerContentLeft"></div>
          <div class="reader-page-number" id="readerLeftNumber">1</div>
        </article>
        <div class="reader-spine" aria-hidden="true"></div>
        <article class="reader-sheet reader-sheet-right" id="readerSheetRight">
          <div class="reader-sheet-head reader-sheet-head-right"><p class="reader-kicker" id="readerKickerRight"></p><span id="readerRunningRight" class="reader-running-title"> </span></div>
          <div class="reader-page-content" id="readerContentRight"></div>
          <div class="reader-page-number" id="readerRightNumber">2</div>
        </article>
      </div>
    </div>
  </main>

  <div class="reader-toast" id="readerToast" role="status" aria-live="polite" hidden></div>
  <footer class="reader-controls" id="readerControls">
    <button class="reader-control" id="menuButton" title="Содержание">☰</button>
    <button class="reader-control" id="prevButton" title="Назад (←)">←</button>
    <span class="reader-progress" id="readerProgress">Стр. 1–2</span>
    <button class="reader-control" id="nextButton" title="Вперёд (→)">→</button>
    <span class="reader-control-divider"></span>
    <button class="reader-control part-control" id="prevPartButton" title="Предыдущая часть (↓)">↓</button>
    <button class="reader-control part-control" id="nextPartButton" title="Следующая часть (↑)">↑</button>
    <button class="reader-control" id="themeButton" title="Оформление">Aa</button>
  </footer>

  <div class="theme-panel hidden" id="themePanel">
    <button data-theme="paper">Бумага</button><button data-theme="night">Ночь</button><button data-theme="warm">Тёплый дуб</button>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/reader.js"></script>
</body>
</html>
